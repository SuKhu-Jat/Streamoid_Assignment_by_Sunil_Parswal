<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamoid Product Catalog Manager</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <header class="mb-10 text-center">
            <div class="inline-block bg-slate-200 p-3 rounded-full mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-700"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </div>
            <h1 class="text-4xl font-bold text-slate-900 tracking-tight">Product Catalog Manager</h1>
            <p class="text-lg text-slate-600 mt-2">Upload, view, and search your product data seamlessly.</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <div class="lg:col-span-1 space-y-8">
                
                <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200 transition-all hover:shadow-lg">
                    <h2 class="text-2xl font-semibold mb-4 border-b border-slate-200 pb-3 text-slate-800"> Upload CSV</h2>
                    <form id="upload-form">
                        <label for="csv-file" class="block mb-2 font-medium text-slate-700">Select a CSV file:</label>
                        <input type="file" id="csv-file" name="file" accept=".csv" required class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 cursor-pointer">
                        <button type="submit" id="upload-btn" class="mt-4 w-full bg-teal-600 text-white font-bold py-2.5 px-4 rounded-lg hover:bg-teal-700 transition-all duration-300 flex items-center justify-center gap-2 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 disabled:opacity-70 disabled:hover:scale-100">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            Upload and Process
                        </button>
                    </form>
                    <div id="upload-results" class="mt-4 text-sm space-y-2"></div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200 transition-all hover:shadow-lg">
                    <h2 class="text-2xl font-semibold mb-4 border-b border-slate-200 pb-3 text-slate-800"> Search & Filter</h2>
                    <form id="search-form" class="space-y-4">
                        <div>
                            <label for="brand" class="block text-sm font-medium text-slate-700">Brand</label>
                            <input type="text" id="brand" name="brand" class="mt-1 block w-full px-3 py-2 bg-white border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="color" class="block text-sm font-medium text-slate-700">Color</label>
                            <input type="text" id="color" name="color" class="mt-1 block w-full px-3 py-2 bg-white border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="min-price" class="block text-sm font-medium text-slate-700">Min Price</label>
                                <input type="number" id="min-price" name="minPrice" min="0" class="mt-1 block w-full px-3 py-2 bg-white border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                            </div>
                            <div>
                                <label for="max-price" class="block text-sm font-medium text-slate-700">Max Price</label>
                                <input type="number" id="max-price" name="maxPrice" min="0" class="mt-1 block w-full px-3 py-2 bg-white border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
                            </div>
                        </div>
                        <div class="flex space-x-2 pt-2">
                             <button type="submit" id="search-btn" class="w-full bg-slate-800 text-white font-bold py-2.5 px-4 rounded-lg hover:bg-slate-900 transition-all duration-300 flex items-center justify-center gap-2 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 disabled:opacity-70 disabled:hover:scale-100">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                                Search
                             </button>
                             <button type="reset" id="reset-btn" class="w-full bg-slate-200 text-slate-700 font-bold py-2.5 px-4 rounded-lg hover:bg-slate-300 transition-all duration-300 flex items-center justify-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                                Reset</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md border border-slate-200 flex flex-col">
                <h2 class="text-2xl font-semibold mb-4 border-b border-slate-200 pb-3 text-slate-800"> Product Data</h2>
                
                <div id="products-table-container" class="overflow-x-auto flex-grow">
                    <div id="table-placeholder" class="text-center py-16">
                        <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-12 w-12 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        <h3 class="mt-2 text-sm font-medium text-slate-900">No Products To Display</h3>
                        <p class="mt-1 text-sm text-slate-500">Upload a CSV file to get started.</p>
                    </div>
                    <table class="min-w-full divide-y divide-slate-200 hidden" id="products-table">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">SKU</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Brand</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Color</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Size</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Price</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">MRP</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Qty</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body" class="bg-white divide-y divide-slate-200">
                            </tbody>
                    </table>
                </div>
                
                <div id="pagination-controls" class="mt-auto pt-4 flex items-center justify-between hidden">
                    <button id="prev-page" class="bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded-lg hover:bg-slate-300 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">Previous</button>
                    <span id="page-info" class="text-sm font-medium text-slate-600"></span>
                    <button id="next-page" class="bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded-lg hover:bg-slate-300 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">Next</button>
                </div>
            </div>
        </main>
        <footer class="text-center mt-10 text-slate-500 text-sm">
            <p>&copy; 2025 Product Catalog Manager. Made by SK Choudhary. </p>
        </footer>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
